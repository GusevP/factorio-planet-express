[tips-and-tricks-item-description]
planet-express=Planet Express はあなたの宇宙プラットフォームを自動の惑星間輸送船隊に変えます。各惑星のカーゴ着陸場が何を要求しているかを監視し、余剰を持つ別の惑星を見つけ、登録済みのプラットフォームの 1 つを手配して品物を運ばせます — そして帰路には余ったカーゴを持ち帰ります。\n\n何かを建設・破壊・テレポート・手動挿入することは決してありません。プラットフォームのスケジュールとそのハブの物流要求を設定するだけです。船のスケジュールを自分で編集すると、Mod は手を引いてあなたに任せます。
planet-express-research=Mod 全体はただ 1 つの技術の先にロックされています：[technology=interplanetary-trade-logistics]。それを研究するまで「交易」と「船隊」のタブは隠れたままで、どのプラットフォームも一切触られません。\n\nそのレシピは宇宙サイエンスを必要とするため、解放できる頃にはすでに軌道上に登録できるプラットフォームがあるはずです。
planet-express-enroll=[entity=space-platform-hub] を開き、「船隊」タブに切り替えます。\n\n「このプラットフォームを商船隊に登録する」にチェックを入れて Planet Express に引き渡します — ディスパッチされるのは登録済みで待機中の船だけです。「手動運用のために確保」にチェックを入れると船を自分用に残せます。リスト内の惑星のチェックを外すと、船の行き先を制限できます。
planet-express-trade=惑星の [entity=cargo-landing-pad] を開き、「交易」タブに切り替えます。着陸場が要求するものはすべてその惑星の輸入需要になります。\n\n惑星が品目を輸出できるようになる前に在庫を保持するよう「確保」を設定したり、品目の「優先度」を上げて先に発送させたり、航路に「優先する船」を固定したりできます。「この惑星の現在」の表示は、リアルタイムの需要、輸出可能な余剰、すでに輸送中のカーゴを示します。
planet-express-monitor=画面左上に小さな状態パネルがあり、船隊をひと目で把握できます — 何隻が稼働・待機・停滞しているか。それをクリックするか、上部バーのショートカットをクリックすると、完全な船隊モニターが開きます。\n\nモニターは各船（その名前・航路・現在の惑星）と、惑星ごとにまとめた「需要」セクションを一覧表示し、それぞれについて何が配送中・積込中・まだ待機中かを — その理由とともに — 示します。
planet-express-stuck=船は、まったく進捗のないまま時間切れになると「停止中」と扱われます。原因はたいてい燃料切れ、ロケット切れ、経路の遮断です。船隊モニターの「停止中」表示にマウスを合わせると原因が表示されます。燃料や弾薬を補給すれば、次の配送が成功した時点で自動的に解除されます。\n\n推進を一時停止した船は代わりに「推進停止」と表示されます。一時停止したプラットフォームはスケジュールを一切進めないため、船隊はその貨物を別の船に引き継ぎ、この船には手を出しません。一時停止を解除すれば自動的に船隊へ復帰します。\n\n単に資源が足りない惑星は、停止した船ではありません。それは「惑星」セクションに「待機中」として理由（供給元なし、船なしなど）とともに表示されます。船が停止中なのは、物理的に動けないときだけです。\n\n船が停止していて上記のいずれにも当てはまらない場合は、停止しているうちにコンソールで [font=default-semibold]/pe-status[/font] を実行してください。配送中の各船について船隊が把握している内容を出力し、factorio-current.log にも書き出すので、バグ報告にコピーできます。読み取るだけで、何も変更せず、実績も無効になりません。
planet-express-ready-signal=ときには船が待機中でも、まだ送り出したくない場合があります — 往復の燃料が足りない、弾薬が少ない、または小惑星バッファがまだ満たされている途中など。\n\n「船隊」タブで「準備信号まで保留」にチェックを入れます。有効な間、Planet Express はそのハブが [virtual-signal=planet-express-ready] をゼロより大きく読み取ったときだけ、そのプラットフォームを送り出します。準備のロジックは自分の回路で好きなように組み、その 1 つの信号をハブに送ってください。\n\nこのゲートはディスパッチ時のみに作用します：すでに飛行中の船を呼び戻すことは決してありません。保留された船はモニターの行に「保留中」と表示されます。
