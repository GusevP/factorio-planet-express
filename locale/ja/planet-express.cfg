[mod-setting-description]
planet-express-debug-log=各ディスパッチ判断（なぜこの供給元・この船・この数量か）をログに記録します。交易の挙動を診断するのに使います。
planet-express-dispatch-interval=ディスパッチャーが交易を探す頻度（ティック単位、60 = 1 秒）。小さいほど応答が速くなりますが UPS を多く消費します。
planet-express-min-trip=この個数を下回る余剰は無視され、ディスパッチャーが無意味なちびちび輸送を組まないようにします。
planet-express-default-reserve=各新規惑星が品目を輸出する前に在庫として確保する量。品目ごとの例外は着陸場の「交易」タブで設定します。
planet-express-max-ships-global=船隊全体が同時に運航できる船の最大数。0 = 無制限。
planet-express-max-ships-route=単一の供給元／目的地ペア間で同時に運航する船の最大数。0 = 無制限。
planet-express-two-way-return=有効にすると、帰路の船は目的地に余っていて供給元がまだ必要としている品物も運びます（同じ 2 つの惑星）。
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

