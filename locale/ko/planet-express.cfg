[mod-setting-description]
planet-express-debug-log=모든 배차 결정(왜 이 공급원, 이 함선, 이 수량인지)을 로그에 기록합니다. 교역 동작을 진단하는 데 사용하세요.
planet-express-dispatch-interval=배차기가 교역을 탐색하는 빈도(틱 단위, 60 = 1초). 낮을수록 반응이 빠르지만 UPS를 더 많이 소모합니다.
planet-express-min-trip=이 수량보다 적은 잉여는 무시되어, 배차기가 무의미한 찔끔 운송을 절대 계획하지 않도록 합니다.
planet-express-default-reserve=각 새 행성이 품목을 수출하기 전에 재고로 비축하는 양. 품목별 예외는 착륙장의 "교역" 탭에서 설정합니다.
planet-express-max-ships-global=함대 전체가 동시에 운항할 수 있는 함선의 최대 수. 0 = 무제한.
planet-express-max-ships-route=단일 공급원/목적지 쌍 사이에서 동시에 운항하는 함선의 최대 수. 0 = 무제한.
planet-express-two-way-return=켜면 귀환하는 함선이 목적지에 남고 공급원이 여전히 필요로 하는 물품도 함께 운반합니다(같은 두 행성).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

