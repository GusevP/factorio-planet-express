[tips-and-tricks-item-description]
planet-express=Planet Express는 당신의 우주 플랫폼을 자동 행성 간 운송 함대로 바꿉니다. 각 행성의 화물 착륙장이 무엇을 요청하는지 지켜보고, 잉여가 있는 다른 행성을 찾아, 등록된 플랫폼 중 하나를 배정해 물품을 실어 나릅니다 — 그리고 돌아오는 길에 남는 화물을 가져옵니다.\n\n무언가를 건설·파괴·순간이동하거나 손으로 집어넣는 일은 결코 없습니다. 플랫폼의 일정과 그 허브의 물류 요청만 설정할 뿐입니다. 함선의 일정을 직접 편집하면 모드는 물러나 당신에게 맡깁니다.
planet-express-research=모드 전체는 단 하나의 기술 뒤에 잠겨 있습니다: [technology=interplanetary-trade-logistics]. 그것을 연구하기 전까지 "교역"과 "함대" 탭은 숨겨진 채로 있고, 어떤 플랫폼도 결코 건드려지지 않습니다.\n\n그 제조법은 우주 과학을 필요로 하므로, 해금할 수 있게 될 무렵이면 이미 궤도에 등록할 플랫폼이 있을 것입니다.
planet-express-enroll=[entity=space-platform-hub]을(를) 열고 "함대" 탭으로 전환합니다.\n\n"이 플랫폼을 상선대에 등록"에 체크하여 Planet Express에 맡깁니다 — 등록되고 유휴 상태인 함선만 배차됩니다. "수동 사용을 위해 예약"에 체크하면 함선을 직접 쓰려고 남겨둘 수 있고, 목록에서 행성의 체크를 해제하면 함선이 갈 수 있는 곳을 제한할 수 있습니다.
planet-express-trade=행성의 [entity=cargo-landing-pad]을(를) 열고 "교역" 탭으로 전환합니다. 착륙장이 요청하는 모든 것이 그 행성의 수입 수요가 됩니다.\n\n행성이 품목을 수출할 수 있기 전에 약간의 재고를 보유하도록 "비축"을 설정하거나, 품목의 "우선순위"를 높여 먼저 발송되게 하거나, 항로에 "선호 함선"을 고정할 수 있습니다. "이 행성 현재" 표시는 실시간 수요, 수출 가능한 잉여, 이미 운송 중인 화물을 보여줍니다.
planet-express-monitor=화면 왼쪽 위에 작은 상태 패널이 있어 함대를 한눈에 파악할 수 있습니다 — 얼마나 많은 함선이 작업 중, 유휴, 또는 멈춤인지. 그것을 클릭하거나 상단 막대의 단축 아이콘을 클릭하면 전체 함대 모니터가 열립니다.\n\n모니터는 각 함선(이름, 항로, 현재 행성)과 행성별로 묶인 "수요" 구역을 나열하며, 각 행성에 대해 무엇이 배송 중, 적재 중, 또는 아직 대기 중인지 — 그리고 그 이유를 보여줍니다.
planet-express-stuck=함선은 진전 없이 시간 초과되면 "멈춤"으로 간주됩니다 — 보통 연료가 떨어졌거나, 로켓이 떨어졌거나, 경로가 막힌 경우입니다. 연료를 채우거나 재무장하면 다음 성공적인 배송 때 스스로 해제됩니다.\n\n단지 자원이 부족한 행성은 멈춘 함선이 아닙니다: 그것은 "수요" 구역에 "대기 중"으로, 이유(공급원 없음, 함선 없음 등)와 함께 표시됩니다. 함선은 물리적으로 움직일 수 없을 때만 멈춤입니다.
planet-express-ready-signal=때로는 함선이 유휴 상태여도 아직 내보내고 싶지 않을 수 있습니다 — 왕복 연료가 부족하거나, 탄약이 적거나, 소행성 완충고가 아직 채워지는 중일 때 등.\n\n"함대" 탭에서 "준비 신호까지 보류"에 체크합니다. 켜져 있는 동안 Planet Express는 그 허브가 [virtual-signal=planet-express-ready]을(를) 0보다 크게 읽을 때만 해당 플랫폼을 내보냅니다. 준비 논리는 자신의 회로에서 원하는 대로 구성하고 그 하나의 신호를 허브로 보내세요.\n\n이 차단은 배차에만 작용합니다: 이미 비행 중인 함선을 결코 불러들이지 않습니다. 보류된 함선은 모니터 행에 "보류됨"으로 표시됩니다.
