planet-express-debug-log=Planet Express: registro de depuração
planet-express-dispatch-interval=Planet Express: intervalo do despachante (ticks)
planet-express-min-trip=Planet Express: tamanho mínimo de remessa
planet-express-default-reserve=Planet Express: reserva padrão
