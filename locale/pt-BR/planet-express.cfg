[technology-name]
interplanetary-trade-logistics=Logística de comércio interplanetário

[technology-description]
interplanetary-trade-logistics=Desbloqueia a interface de comércio do Planet Express nas plataformas de pouso de carga e a capacidade de inscrever plataformas espaciais na sua frota mercante.

