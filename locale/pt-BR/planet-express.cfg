[mod-setting-description]
planet-express-debug-log=Registra cada decisão de despacho (por que esta fonte, esta nave, esta quantidade) no log. Use para diagnosticar o comportamento de comércio.
planet-express-dispatch-interval=Com que frequência o despachante procura trocas, em ticks (60 = 1 segundo). Mais baixo é mais responsivo, mas custa mais UPS.
planet-express-min-trip=Excedente abaixo desta quantidade de itens é ignorado, para que o despachante nunca agende um fiozinho inútil.
planet-express-default-reserve=A quantidade que cada novo planeta mantém em estoque antes de exportar um item. Exceções por item são definidas na aba Comércio da plataforma.
planet-express-max-ships-global=Número máximo de naves que toda a frota pode ter em voo ao mesmo tempo. 0 = ilimitado.
planet-express-max-ships-route=Número máximo de naves em voo entre um único par origem/destino ao mesmo tempo. 0 = ilimitado.
planet-express-two-way-return=Quando ativado, uma nave que retorna também leva bens que o destino tem de sobra e que a origem ainda precisa (os mesmos dois planetas).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

