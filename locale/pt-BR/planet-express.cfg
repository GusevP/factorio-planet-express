[tips-and-tricks-item-description]
planet-express=O Planet Express transforma suas plataformas espaciais em uma frota de transporte interplanetário automática. Ele observa o que a plataforma de pouso de carga de cada planeta está pedindo, encontra outro planeta com excedente e agenda uma das suas plataformas inscritas para levar os bens — trazendo a carga sobressalente na viagem de volta.\n\nEle nunca constrói, destrói, teletransporta ou insere nada à mão: apenas define o horário de uma plataforma e os pedidos logísticos do hub dela. Edite o horário de uma nave você mesmo e o mod recua e deixa por sua conta.
planet-express-research=O mod inteiro fica trancado atrás de uma única tecnologia: [technology=interplanetary-trade-logistics]. Até você pesquisá-la, as abas Comércio e Frota permanecem ocultas e nenhuma plataforma é jamais tocada.\n\nSua receita exige ciência espacial, então quando você puder desbloqueá-la já terá uma plataforma em órbita para inscrever.
planet-express-enroll=Abra um [entity=space-platform-hub] e mude para a aba Frota.\n\nMarque "Inscrever esta plataforma na frota mercante" para entregá-la ao Planet Express — só naves inscritas e ociosas são despachadas. Marque "Reservar para uso manual" para guardar uma nave para você, ou desmarque planetas na lista para limitar para onde uma nave voará.
planet-express-trade=Abra a [entity=cargo-landing-pad] de um planeta e mude para a aba Comércio. Tudo que a plataforma pedir vira a demanda de importação daquele planeta.\n\nDefina uma Reserva para que um planeta guarde algum estoque antes de poder exportar um item, aumente a Prioridade de um item para que ele seja enviado primeiro, ou fixe uma Nave preferida em uma rota. O indicador "Este planeta agora" mostra a demanda ao vivo, o excedente exportável e a carga já a caminho.
planet-express-monitor=Um pequeno painel de estado fica no canto superior esquerdo com a sua frota num relance — quantas naves estão trabalhando, ociosas ou travadas. Clique nele, ou no atalho da barra superior, para abrir o Monitor da frota completo.\n\nO Monitor lista cada nave (seu nome, rota e planeta atual) e uma seção Demanda agrupada por planeta, mostrando para cada um o que está sendo entregue, carregado ou ainda aguardando — e por quê.
planet-express-stuck=Uma nave conta como “parada” quando esgota o tempo sem fazer progresso — normalmente sem combustível, sem foguetes ou com a rota bloqueada. Passe o mouse sobre o rótulo “parada” no monitor da frota e ele nomeia a causa. Reabasteça ou rearme a nave e o estado se resolve sozinho na próxima entrega bem-sucedida.\n\nUma nave cuja propulsão você pausou mostra “propulsão pausada”. Uma plataforma pausada nunca avança no seu cronograma, então a frota passa a carga dela para outra nave e deixa esta em paz — retire a pausa e ela volta à frota sozinha.\n\nUm planeta que simplesmente não tem recursos não é uma nave parada: isso aparece na seção Planetas como “aguardando”, com o motivo (sem origem, sem nave e assim por diante). Uma nave só está parada quando fisicamente não consegue se mover.\n\nSe uma nave estiver parada e nada disso explicar, execute [font=default-semibold]/pe-status[/font] no console enquanto ela ainda estiver parada. Ele relata o que a frota vê para cada nave em entrega e grava isso em factorio-current.log, para você copiar em um relato de bug. Ele apenas lê: não muda nada e não desativa conquistas.
planet-express-ready-signal=Às vezes uma nave está ociosa, mas você ainda não quer despachá-la — combustível insuficiente para a viagem de ida e volta, pouca munição, ou um buffer de asteroides ainda enchendo.\n\nNa aba Frota, marque "Reter até o sinal de pronto". Enquanto estiver ativado, o Planet Express só despacha aquela plataforma quando o hub dela lê [virtual-signal=planet-express-ready] acima de zero. Construa a lógica de prontidão como quiser nos seus próprios combinadores e emita esse único sinal para o hub.\n\nO bloqueio é só de despacho: ele nunca chama de volta uma nave já em voo. Uma nave retida aparece como "retida" na sua linha do Monitor.
