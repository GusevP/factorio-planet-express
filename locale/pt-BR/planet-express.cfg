strand-no_thrust=Parada: a plataforma está seguindo a rota, mas não se move. Quase certamente ficou sem combustível de propulsor ou oxidante — verifique o abastecimento.
strand-no_path=Parada: a plataforma não tem para onde ir. O destino não é alcançável de onde ela está — verifique se existe uma rota para esse planeta.
strand-no_schedule=Parada: a plataforma não tem paradas no cronograma. Algo apagou a rota — ela receberá novas ordens no próximo despacho.
strand-paused=Parada: a plataforma está pausada. Retire a pausa e a frota voltará a usá-la.
strand-waiting=Parada: a plataforma está estacionada em uma parada e sua condição de espera nunca foi satisfeita. A carga esperada nunca chegou — verifique o estoque do planeta e o espaço livre do porão.
strand-ready=Retida: a plataforma está com “Reter até o sinal de pronto” ativo e seu hub lê planet-express-ready ≤ 0. Envie o sinal para liberá-la.
strand-unknown=Parada: a plataforma não fez progresso durante toda uma janela de vigilância e a causa não pôde ser identificada.
