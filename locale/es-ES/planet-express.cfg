[technology-name]
interplanetary-trade-logistics=Logística de comercio interplanetario

[technology-description]
interplanetary-trade-logistics=Desbloquea la interfaz comercial de Planet Express en las plataformas de aterrizaje de carga y la posibilidad de inscribir plataformas espaciales en tu flota mercante.

