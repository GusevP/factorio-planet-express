[tips-and-tricks-item-description]
planet-express=Planet Express convierte tus plataformas espaciales en una flota de transporte interplanetario automática. Vigila lo que pide la plataforma de aterrizaje de carga de cada planeta, encuentra otro planeta con excedente y programa una de tus plataformas inscritas para llevar los bienes — trayendo de vuelta la carga sobrante en el viaje de regreso.\n\nNunca construye, destruye, teletransporta ni inserta nada a mano: solo establece el horario de una plataforma y las peticiones logísticas de su centro. Edita tú mismo el horario de una nave y el mod se retira y te lo deja a ti.
planet-express-research=Todo el mod está bloqueado tras una única tecnología: [technology=interplanetary-trade-logistics]. Hasta que la investigues, las pestañas Comercio y Flota permanecen ocultas y ninguna plataforma se toca jamás.\n\nSu receta requiere ciencia espacial, así que para cuando puedas desbloquearla ya tendrás una plataforma en órbita que inscribir.
planet-express-enroll=Abre un [entity=space-platform-hub] y cambia a la pestaña Flota.\n\nMarca «Inscribir esta plataforma en la flota mercante» para entregarla a Planet Express — solo se despachan naves inscritas e inactivas. Marca «Reservar para uso manual» para guardar una nave para ti, o desmarca planetas en la lista para limitar a dónde volará una nave.
planet-express-trade=Abre la [entity=cargo-landing-pad] de un planeta y cambia a la pestaña Comercio. Todo lo que pida la plataforma se convierte en la demanda de importación de ese planeta.\n\nEstablece una Reserva para que un planeta conserve algo de stock antes de poder exportar un objeto, sube la Prioridad de un objeto para que se envíe primero, o fija una Nave preferida para una ruta. El indicador «Este planeta ahora» muestra la demanda en vivo, el excedente exportable y la carga que ya va en camino.
planet-express-monitor=Un pequeño panel de estado se sitúa en la esquina superior izquierda con tu flota de un vistazo — cuántas naves están trabajando, inactivas o atascadas. Haz clic en él, o en el acceso directo de la barra superior, para abrir el Monitor de flota completo.\n\nEl Monitor lista cada nave (su nombre, ruta y planeta actual) y una sección de Demanda agrupada por planeta, que muestra para cada uno qué se está entregando, cargando o aún esperando — y por qué.
planet-express-stuck=Una nave cuenta como «atascada» cuando agota su tiempo sin hacer progreso — normalmente sin combustible, sin cohetes, o con su camino bloqueado. Reabastécela o rearmala y se desatasca sola en su siguiente entrega exitosa.\n\nUn planeta que simplemente carece de recursos no es una nave atascada: eso se muestra en la sección de Demanda como «esperando», con el motivo (sin fuente, sin nave, etc.). Una nave solo está atascada cuando físicamente no puede moverse.
planet-express-ready-signal=A veces una nave está inactiva pero no quieres despacharla aún — no hay suficiente combustible para el viaje de ida y vuelta, poca munición, o un búfer de asteroides todavía llenándose.\n\nEn la pestaña Flota, marca «Retener hasta señal de listo». Mientras esté activado, Planet Express solo despacha esa plataforma cuando su centro lee [virtual-signal=planet-express-ready] por encima de cero. Construye la lógica de disponibilidad como quieras en tus propios combinadores y emite esa única señal al centro.\n\nEl bloqueo es solo de despacho: nunca hace regresar a una nave ya en vuelo. Una nave retenida aparece como «retenido» en su fila del Monitor.
