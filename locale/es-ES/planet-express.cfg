[mod-setting-description]
planet-express-debug-log=Registra cada decisión de despacho (por qué esta fuente, esta nave, esta cantidad) en el registro. Úsalo para diagnosticar el comportamiento comercial.
planet-express-dispatch-interval=Con qué frecuencia el despachador busca intercambios, en ticks (60 = 1 segundo). Más bajo es más reactivo pero cuesta más UPS.
planet-express-min-trip=El excedente por debajo de esta cantidad de objetos se ignora, para que el despachador nunca programe un goteo inútil.
planet-express-default-reserve=La cantidad que cada planeta nuevo mantiene en stock antes de exportar un objeto. Las excepciones por objeto se configuran en la pestaña Comercio de la plataforma.
planet-express-max-ships-global=Número máximo de naves que toda la flota puede tener en vuelo a la vez. 0 = ilimitado.
planet-express-max-ships-route=Número máximo de naves en vuelo entre un único par origen/destino a la vez. 0 = ilimitado.
planet-express-two-way-return=Cuando está activado, una nave que regresa también lleva bienes que el destino tiene de sobra y que el origen aún necesita (los mismos dos planetas).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

