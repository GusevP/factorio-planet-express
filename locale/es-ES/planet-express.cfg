strand-no_thrust=Atascada: la plataforma sigue su ruta pero no se mueve. Casi con seguridad se ha quedado sin combustible de propulsor u oxidante — revisa su suministro de combustible.
strand-no_path=Atascada: la plataforma no tiene adónde ir. Su destino no es alcanzable desde donde está — comprueba que exista una ruta a ese planeta.
strand-no_schedule=Atascada: la plataforma no tiene paradas en su horario. Algo borró su ruta — recibirá nuevas órdenes en el próximo envío.
strand-paused=Atascada: la plataforma está pausada. Quita la pausa y la flota volverá a usarla.
strand-waiting=Atascada: la plataforma está detenida en una parada y su condición de espera nunca se cumplió. La carga que espera nunca llegó — revisa las existencias del planeta y el espacio libre de la bodega.
strand-ready=Retenida: la plataforma tiene activado «Retener hasta señal de listo» y su centro lee planet-express-ready ≤ 0. Envía la señal para liberarla.
strand-unknown=Atascada: la plataforma no avanzó durante toda una ventana de vigilancia y no se pudo identificar la causa.
