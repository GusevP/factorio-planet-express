[tips-and-tricks-item-description]
planet-express=Planet Express trasforma le tue piattaforme spaziali in una flotta di trasporto interplanetario automatica. Osserva ciò che la piattaforma di atterraggio merci di ogni pianeta richiede, trova un altro pianeta con un surplus e programma una delle tue piattaforme arruolate per trasportare i beni — riportando indietro il carico in eccesso al ritorno.\n\nNon costruisce, distrugge, teletrasporta né inserisce mai nulla a mano: imposta solo l'orario di una piattaforma e le richieste logistiche del suo hub. Modifica tu stesso l'orario di una nave e la mod si ritira e lo lascia a te.
planet-express-research=L'intera mod è bloccata dietro un'unica tecnologia: [technology=interplanetary-trade-logistics]. Finché non la ricerchi, le schede Commercio e Flotta restano nascoste e nessuna piattaforma viene mai toccata.\n\nLa sua ricetta richiede scienza spaziale, quindi quando potrai sbloccarla avrai già una piattaforma in orbita da arruolare.
planet-express-enroll=Apri un [entity=space-platform-hub] e passa alla scheda Flotta.\n\nSpunta «Arruola questa piattaforma nella flotta mercantile» per affidarla a Planet Express — vengono spedite solo navi arruolate e inattive. Spunta «Riserva per uso manuale» per tenere una nave per te, oppure deseleziona pianeti nell'elenco per limitare dove una nave volerà.
planet-express-trade=Apri la [entity=cargo-landing-pad] di un pianeta e passa alla scheda Commercio. Tutto ciò che la piattaforma richiede diventa la domanda di importazione di quel pianeta.\n\nImposta una Riserva affinché un pianeta conservi un po' di scorta prima di poter esportare un oggetto, aumenta la Priorità di un oggetto perché venga spedito per primo, oppure fissa una Nave preferita su una rotta. L'indicatore «Questo pianeta ora» mostra la domanda in tempo reale, il surplus esportabile e il carico già in viaggio.
planet-express-monitor=Un piccolo pannello di stato si trova nell'angolo in alto a sinistra con la tua flotta a colpo d'occhio — quante navi sono in attività, inattive o bloccate. Cliccaci sopra, o sulla scorciatoia della barra superiore, per aprire il Monitoraggio flotta completo.\n\nIl Monitoraggio elenca ogni nave (nome, rotta e pianeta attuale) e una sezione Domanda raggruppata per pianeta, mostrando per ciascuno cosa è in consegna, in carico o ancora in attesa — e perché.
planet-express-stuck=Una nave risulta «bloccata» quando scade il tempo senza fare progressi — di solito senza carburante, senza razzi o con il percorso ostruito. Passa il mouse sull'etichetta «bloccata» nel monitor della flotta e ne indicherà la causa. Rifornisci o riarma la nave e lo stato si risolve da solo alla consegna successiva.\n\nUna nave con la propulsione in pausa mostra invece «propulsione in pausa». Una piattaforma in pausa non avanza mai nel suo orario, quindi la flotta affida il suo carico a un'altra nave e lascia stare questa — togli la pausa e rientrerà nella flotta da sola.\n\nUn pianeta a cui semplicemente mancano risorse non è una nave bloccata: questo compare nella sezione Pianeti come «in attesa», con il motivo (nessuna fonte, nessuna nave e così via). Una nave è bloccata solo quando fisicamente non può muoversi.\n\nSe una nave è bloccata e nulla di quanto sopra lo spiega, esegui [font=default-semibold]/pe-status[/font] nella console mentre è ancora bloccata. Riporta ciò che la flotta vede per ogni nave in consegna e lo scrive in factorio-current.log, così puoi copiarlo in una segnalazione. Si limita a leggere: non cambia nulla e non disattiva gli obiettivi.
planet-express-ready-signal=A volte una nave è inattiva ma non vuoi ancora spedirla — carburante insufficiente per il viaggio di andata e ritorno, munizioni scarse, o un buffer di asteroidi ancora in riempimento.\n\nNella scheda Flotta, spunta «Trattieni fino al segnale di pronto». Mentre è attivo, Planet Express spedisce quella piattaforma solo quando il suo hub legge [virtual-signal=planet-express-ready] sopra lo zero. Costruisci la logica di prontezza come preferisci nei tuoi combinatori ed emetti quell'unico segnale verso l'hub.\n\nIl blocco riguarda solo la spedizione: non richiama mai una nave già in volo. Una nave trattenuta appare come «trattenuto» nella sua riga del Monitoraggio.
