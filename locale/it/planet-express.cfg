interplanetary-trade-logistics=Logistica del commercio interplanetario

[technology-description]
interplanetary-trade-logistics=Sblocca l'interfaccia commerciale di Planet Express sulle piattaforme di atterraggio merci e la possibilità di arruolare piattaforme spaziali nella tua flotta mercantile.

