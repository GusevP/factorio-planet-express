[mod-setting-description]
planet-express-debug-log=Registra ogni decisione di spedizione (perché questa fonte, questa nave, questa quantità) nel log. Usalo per diagnosticare il comportamento commerciale.
planet-express-dispatch-interval=Quanto spesso lo smistatore cerca scambi, in tick (60 = 1 secondo). Più basso è più reattivo ma costa più UPS.
planet-express-min-trip=Un surplus inferiore a questo numero di oggetti viene ignorato, così lo smistatore non programma mai un rivolo inutile.
planet-express-default-reserve=La quantità che ogni nuovo pianeta tiene in scorta prima di esportare un oggetto. Le eccezioni per singolo oggetto si impostano nella scheda Commercio della piattaforma.
planet-express-max-ships-global=Numero massimo di navi che l'intera flotta può avere in volo contemporaneamente. 0 = illimitato.
planet-express-max-ships-route=Numero massimo di navi in volo tra una singola coppia origine/destinazione contemporaneamente. 0 = illimitato.
planet-express-two-way-return=Se attivo, una nave che torna trasporta anche i beni che la destinazione ha in eccesso e di cui l'origine ha ancora bisogno (gli stessi due pianeti).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

