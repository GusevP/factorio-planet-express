strand-no_thrust=Bloccata: la piattaforma sta seguendo la rotta ma non si muove. Quasi certamente ha finito il carburante dei propulsori o l'ossidante — controlla il rifornimento.
strand-no_path=Bloccata: la piattaforma non ha dove andare. La destinazione non è raggiungibile da dove si trova — verifica che esista una rotta verso quel pianeta.
strand-no_schedule=Bloccata: la piattaforma non ha fermate nel suo orario. Qualcosa ha cancellato la rotta — riceverà nuovi ordini alla prossima spedizione.
strand-paused=Bloccata: la piattaforma è in pausa. Togli la pausa e la flotta tornerà a usarla.
strand-waiting=Bloccata: la piattaforma è ferma a una sosta e la sua condizione di attesa non si è mai verificata. Il carico atteso non è mai arrivato — controlla le scorte del pianeta e lo spazio libero nella stiva.
strand-ready=Trattenuta: sulla piattaforma è attivo «Trattieni fino al segnale di pronto» e il suo hub legge planet-express-ready ≤ 0. Invia il segnale per rilasciarla.
strand-unknown=Bloccata: la piattaforma non ha fatto progressi per un'intera finestra di controllo e la causa non è stata identificata.
