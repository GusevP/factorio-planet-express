strand-no_thrust=Stuck: the platform is following its route but is not moving. It has almost certainly run out of thruster fuel or oxidiser — check its fuel supply.
strand-no_path=Stuck: the platform has nowhere to go. Its destination is not reachable from where it is — check that a route to that planet exists.
strand-no_schedule=Stuck: the platform has no stops in its schedule. Something cleared its route — it will be given new orders on the next dispatch.
strand-paused=Stuck: the platform is paused. Un-pause it and the fleet will use it again.
strand-waiting=Stuck: the platform is parked at a stop and its wait condition never cleared. The cargo it is waiting for never arrived — check the planet's stock and the platform's hold space.
strand-ready=Held: the platform's "Hold until ready signal" is on and its hub reads planet-express-ready ≤ 0. Send the signal to release it.
strand-unknown=Stuck: the platform made no progress for a full watchdog window and the cause could not be identified.
