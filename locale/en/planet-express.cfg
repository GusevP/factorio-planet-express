[technology-name]
interplanetary-trade-logistics=Interplanetary Trade Logistics

[technology-description]
interplanetary-trade-logistics=Unlocks the Planet Express trade overlay on Cargo Landing Pads and the ability to enroll space platforms into your merchant fleet.

