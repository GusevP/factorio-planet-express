[mod-setting-description]
planet-express-debug-log=Record every dispatch decision (why this source, this ship, this quantity) to the log. Use for diagnosing trade behavior.
planet-express-dispatch-interval=How often the dispatcher scans for trades, in ticks (60 = 1 second). Lower is more responsive but costs more UPS.
planet-express-min-trip=Surplus below this many items is ignored, so the dispatcher never schedules a pointless dribble.
planet-express-default-reserve=The amount each new planet keeps in stock before it will export an item. Per-item overrides are set on the pad's Trade tab.
planet-express-max-ships-global=Maximum ships the whole fleet can have in flight at once. 0 = unlimited.
planet-express-max-ships-route=Maximum ships in flight between a single source/destination pair at once. 0 = unlimited.
planet-express-two-way-return=When on, a ship returning home also carries goods the destination has spare and the source still needs (same two planets).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

