[tips-and-tricks-item-description]
planet-express=Planet Express turns your space platforms into an automatic interplanetary haulage fleet. It watches what each planet's cargo landing pad is requesting, finds another planet with a surplus, and schedules one of your enrolled platforms to carry the goods across — bringing spare cargo back on the return trip.\n\nIt never builds, destroys, teleports or hand-inserts anything: it only sets a platform's schedule and its hub's logistic requests. Edit a ship's schedule yourself and the mod backs off and leaves it to you.
planet-express-research=The whole mod is gated behind one technology: [technology=interplanetary-trade-logistics]. Until you research it the Trade and Fleet tabs stay hidden and no platform is ever touched.\n\nIts recipe needs space science, so by the time you can unlock it you will already have a platform in orbit to enrol.
planet-express-enroll=Open a [entity=space-platform-hub] and switch to the Fleet tab.\n\nTick "Enroll this platform in the merchant fleet" to hand it to Planet Express — only enrolled, idle ships are ever dispatched. Tick "Reserve for manual use" to keep a ship for yourself, or untick planets in the list to limit where a ship will fly.
planet-express-trade=Open a planet's [entity=cargo-landing-pad] and switch to the Trade tab. Whatever the pad requests becomes that planet's import demand.\n\nSet a Reserve so a planet keeps some stock before it is allowed to export an item, raise an item's Priority so it ships first, or pin a Preferred ship to a route. The "This planet now" readout shows live demand, exportable surplus, and cargo already on the way.
planet-express-monitor=A small status panel sits in the top-left corner with your fleet at a glance — how many ships are working, idle, or stuck. Click it, or the top-bar shortcut, to open the full Fleet Monitor.\n\nThe Monitor lists every ship (its name, route and current planet) and a Demand section grouped by planet, showing for each what is delivering, loading, or still waiting — and why.
planet-express-stuck=A ship counts as "stuck" when it times out making no progress — usually out of fuel, out of rockets, or with its path blocked. Refuel or rearm it and it clears itself on its next successful delivery.\n\nA planet that simply lacks resources is not a stuck ship: that shows in the Demand section as "waiting", with the reason (no source, no ship, and so on). A ship is only stuck when it physically cannot move.
planet-express-ready-signal=Sometimes a ship is idle but you do not want it dispatched yet — not enough fuel for the round trip, ammo low, or an asteroid buffer still filling.\n\nIn the Fleet tab, tick "Hold until ready signal". While it is on, Planet Express only dispatches that platform when its hub reads [virtual-signal=planet-express-ready] above zero. Build the readiness logic however you like in your own combinators and emit that one signal to the hub.\n\nThe gate is dispatch-only: it never recalls a ship already in flight. A held ship shows as "held" on its Monitor row.
