[technology-name]
interplanetary-trade-logistics=Interplanetare Handelslogistik

[technology-description]
interplanetary-trade-logistics=Schaltet das Planet-Express-Handels-Overlay an Fracht-Landeplätzen frei sowie die Möglichkeit, Weltraumplattformen in deine Handelsflotte aufzunehmen.

