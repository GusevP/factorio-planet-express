[tips-and-tricks-item-description]
planet-express=Planet Express verwandelt deine Weltraumplattformen in eine automatische interplanetare Frachtflotte. Es beobachtet, was der Fracht-Landeplatz jedes Planeten anfordert, findet einen anderen Planeten mit Überschuss und plant eine deiner aufgenommenen Plattformen ein, um die Güter hinüberzubringen — und bringt auf der Rückfahrt überschüssige Fracht mit.\n\nEs baut, zerstört, teleportiert oder platziert niemals etwas von Hand: Es setzt nur den Fahrplan einer Plattform und die Logistikanforderungen ihres Hubs. Bearbeitest du den Fahrplan eines Schiffes selbst, zieht sich der Mod zurück und überlässt es dir.
planet-express-research=Der gesamte Mod ist hinter einer einzigen Technologie verborgen: [technology=interplanetary-trade-logistics]. Bis du sie erforscht hast, bleiben die Tabs Handel und Flotte verborgen und keine Plattform wird je angerührt.\n\nIhr Rezept benötigt Weltraumwissenschaft, daher hast du bis zur Freischaltung bereits eine Plattform im Orbit, die du aufnehmen kannst.
planet-express-enroll=Öffne einen [entity=space-platform-hub] und wechsle zum Flotten-Tab.\n\nAktiviere „Diese Plattform in die Handelsflotte aufnehmen“, um sie Planet Express zu übergeben — nur aufgenommene, untätige Schiffe werden je versandt. Aktiviere „Für manuelle Nutzung reservieren“, um ein Schiff für dich zu behalten, oder wähle Planeten in der Liste ab, um einzuschränken, wohin ein Schiff fliegt.
planet-express-trade=Öffne den [entity=cargo-landing-pad] eines Planeten und wechsle zum Handels-Tab. Was der Landeplatz anfordert, wird zum Importbedarf dieses Planeten.\n\nSetze eine Reserve, damit ein Planet etwas Vorrat behält, bevor er einen Gegenstand exportieren darf, erhöhe die Priorität eines Gegenstands, damit er zuerst verschickt wird, oder lege ein bevorzugtes Schiff für eine Route fest. Die Anzeige „Dieser Planet jetzt“ zeigt den aktuellen Bedarf, den exportierbaren Überschuss und bereits unterwegs befindliche Fracht.
planet-express-monitor=Ein kleines Statusfeld sitzt in der oberen linken Ecke und zeigt deine Flotte auf einen Blick — wie viele Schiffe aktiv, untätig oder blockiert sind. Klicke darauf oder auf die Verknüpfung in der oberen Leiste, um den vollständigen Flottenmonitor zu öffnen.\n\nDer Monitor listet jedes Schiff auf (Name, Route und aktueller Planet) sowie einen nach Planeten gruppierten Bedarfsbereich, der für jeden zeigt, was geliefert, geladen oder noch erwartet wird — und warum.
planet-express-stuck=Ein Schiff gilt als „blockiert“, wenn es ohne Fortschritt eine Zeitüberschreitung hat — meist ohne Treibstoff, ohne Raketen oder mit blockiertem Weg. Betanke oder bewaffne es neu, und es löst sich bei seiner nächsten erfolgreichen Lieferung selbst.\n\nEin Planet, dem schlicht Ressourcen fehlen, ist kein blockiertes Schiff: Das erscheint im Bedarfsbereich als „wartet“, mit dem Grund (keine Quelle, kein Schiff usw.). Ein Schiff ist nur dann blockiert, wenn es sich physisch nicht bewegen kann.
planet-express-ready-signal=Manchmal ist ein Schiff untätig, aber du willst es noch nicht versenden — nicht genug Treibstoff für die Rundreise, wenig Munition oder ein Asteroiden-Puffer, der sich noch füllt.\n\nAktiviere im Flotten-Tab „Bis Bereit-Signal halten“. Solange aktiv, versendet Planet Express diese Plattform nur, wenn ihr Hub [virtual-signal=planet-express-ready] über null liest. Baue die Bereitschaftslogik beliebig in deinen eigenen Schaltkreisen und sende dieses eine Signal an den Hub.\n\nDie Sperre gilt nur für den Versand: Sie ruft niemals ein bereits fliegendes Schiff zurück. Ein gehaltenes Schiff erscheint in seiner Monitorzeile als „gehalten“.
