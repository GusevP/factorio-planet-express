[mod-setting-description]
planet-express-debug-log=Protokolliert jede Versandentscheidung (warum diese Quelle, dieses Schiff, diese Menge). Zur Diagnose des Handelsverhaltens.
planet-express-dispatch-interval=Wie oft der Verteiler nach Handelsmöglichkeiten sucht, in Ticks (60 = 1 Sekunde). Niedriger ist reaktionsschneller, kostet aber mehr UPS.
planet-express-min-trip=Überschuss unterhalb dieser Stückzahl wird ignoriert, damit der Verteiler nie eine sinnlose Kleinstmenge einplant.
planet-express-default-reserve=Die Menge, die jeder neue Planet vorrätig hält, bevor er einen Gegenstand exportiert. Pro-Gegenstand-Ausnahmen werden im Handels-Tab des Landeplatzes gesetzt.
planet-express-max-ships-global=Maximale Anzahl Schiffe, die die gesamte Flotte gleichzeitig im Flug haben darf. 0 = unbegrenzt.
planet-express-max-ships-route=Maximale Anzahl Schiffe gleichzeitig im Flug zwischen einem einzelnen Quelle-Ziel-Paar. 0 = unbegrenzt.
planet-express-two-way-return=Wenn aktiviert, transportiert ein heimkehrendes Schiff auch Güter, die das Ziel übrig hat und die Quelle noch benötigt (dieselben zwei Planeten).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

