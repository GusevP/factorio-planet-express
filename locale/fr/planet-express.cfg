[technology-name]
interplanetary-trade-logistics=Logistique du commerce interplanétaire

[technology-description]
interplanetary-trade-logistics=Débloque l'interface commerciale Planet Express sur les aires de débarquement de fret ainsi que la possibilité d'enrôler des plateformes spatiales dans votre flotte marchande.

