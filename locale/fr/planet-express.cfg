planet-express-debug-log=Planet Express : journal de débogage
planet-express-dispatch-interval=Planet Express : intervalle du répartiteur (ticks)
planet-express-min-trip=Planet Express : taille minimale de livraison
planet-express-default-reserve=Planet Express : réserve par défaut
planet-express-max-ships-global=Planet Express : navires simultanés max (global)
planet-express-max-ships-route=Planet Express : navires simultanés max (par route)
planet-express-two-way-return=Planet Express : commerce de retour bidirectionnel
planet-express-min-load=Planet Express: minimum cargo load (%)

[mod-setting-description]
planet-express-debug-log=Enregistre chaque décision de répartition (pourquoi cette source, ce navire, cette quantité) dans le journal. À utiliser pour diagnostiquer le comportement commercial.
planet-express-dispatch-interval=Fréquence à laquelle le répartiteur recherche des échanges, en ticks (60 = 1 seconde). Plus bas est plus réactif mais coûte plus d'UPS.
planet-express-min-trip=Un surplus inférieur à ce nombre d'objets est ignoré, afin que le répartiteur ne planifie jamais un filet inutile.
planet-express-default-reserve=La quantité que chaque nouvelle planète conserve en stock avant d'exporter un objet. Les exceptions par objet se règlent dans l'onglet Commerce de l'aire.
planet-express-max-ships-global=Nombre maximal de navires que toute la flotte peut avoir en vol simultanément. 0 = illimité.
planet-express-max-ships-route=Nombre maximal de navires en vol entre une même paire source/destination simultanément. 0 = illimité.
planet-express-two-way-return=Lorsque activé, un navire qui rentre transporte aussi les biens dont la destination dispose en trop et dont la source a encore besoin (les deux mêmes planètes).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

