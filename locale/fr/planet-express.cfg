[tips-and-tricks-item-description]
planet-express=Planet Express transforme vos plateformes spatiales en une flotte de transport interplanétaire automatique. Il surveille ce que demande l'aire de débarquement de fret de chaque planète, trouve une autre planète disposant d'un surplus et planifie l'une de vos plateformes enrôlées pour acheminer les biens — en ramenant le fret excédentaire au retour.\n\nIl ne construit, ne détruit, ne téléporte et n'insère jamais rien à la main : il définit seulement l'horaire d'une plateforme et les demandes logistiques de son hub. Modifiez vous-même l'horaire d'un navire et le mod se retire et vous le laisse.
planet-express-research=Tout le mod est verrouillé derrière une seule technologie : [technology=interplanetary-trade-logistics]. Tant que vous ne l'avez pas recherchée, les onglets Commerce et Flotte restent masqués et aucune plateforme n'est jamais touchée.\n\nSa recette nécessite de la science spatiale, donc au moment où vous pourrez la débloquer vous aurez déjà une plateforme en orbite à enrôler.
planet-express-enroll=Ouvrez un [entity=space-platform-hub] et passez à l'onglet Flotte.\n\nCochez « Enrôler cette plateforme dans la flotte marchande » pour la confier à Planet Express — seuls les navires enrôlés et inactifs sont expédiés. Cochez « Réserver pour usage manuel » pour garder un navire pour vous, ou décochez des planètes dans la liste pour limiter où un navire ira.
planet-express-trade=Ouvrez l'[entity=cargo-landing-pad] d'une planète et passez à l'onglet Commerce. Tout ce que l'aire demande devient la demande d'importation de cette planète.\n\nDéfinissez une Réserve pour qu'une planète conserve du stock avant d'être autorisée à exporter un objet, augmentez la Priorité d'un objet pour qu'il parte en premier, ou épinglez un Navire préféré sur une route. L'affichage « Cette planète maintenant » montre la demande en direct, le surplus exportable et le fret déjà en route.
planet-express-monitor=Un petit panneau d'état se trouve dans le coin supérieur gauche avec votre flotte en un coup d'œil — combien de navires sont actifs, inactifs ou bloqués. Cliquez dessus, ou sur le raccourci de la barre supérieure, pour ouvrir le Moniteur de flotte complet.\n\nLe Moniteur liste chaque navire (son nom, sa route et sa planète actuelle) et une section Demande groupée par planète, montrant pour chacune ce qui est en livraison, en chargement ou encore en attente — et pourquoi.
planet-express-stuck=Un navire est considéré comme « bloqué » lorsqu'il expire sans faire de progrès — généralement à court de carburant, à court de roquettes, ou avec son chemin obstrué. Ravitaillez-le ou réarmez-le et il se débloque de lui-même à sa prochaine livraison réussie.\n\nUne planète qui manque simplement de ressources n'est pas un navire bloqué : cela apparaît dans la section Demande comme « en attente », avec la raison (aucune source, aucun navire, etc.). Un navire n'est bloqué que lorsqu'il ne peut physiquement pas bouger.
planet-express-ready-signal=Parfois un navire est inactif mais vous ne voulez pas encore l'expédier — pas assez de carburant pour l'aller-retour, peu de munitions, ou un tampon d'astéroïdes encore en train de se remplir.\n\nDans l'onglet Flotte, cochez « Retenir jusqu'au signal de disponibilité ». Tant que c'est activé, Planet Express n'expédie cette plateforme que lorsque son hub lit [virtual-signal=planet-express-ready] au-dessus de zéro. Construisez la logique de disponibilité comme vous le souhaitez dans vos propres combinateurs et émettez ce seul signal vers le hub.\n\nLe verrou ne concerne que le départ : il ne rappelle jamais un navire déjà en vol. Un navire retenu apparaît comme « retenu » sur sa ligne du Moniteur.
