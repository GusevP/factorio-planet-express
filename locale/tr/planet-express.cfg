strand-no_thrust=Takıldı: platform rotasını izliyor ama ilerlemiyor. Neredeyse kesinlikle itici yakıtı veya oksitleyicisi bitmiş — yakıt beslemesini kontrol edin.
strand-no_path=Takıldı: platformun gidecek yeri yok. Hedefine bulunduğu yerden ulaşılamıyor — o gezegene giden bir rota olduğunu doğrulayın.
strand-no_schedule=Takıldı: platformun çizelgesinde hiç durak yok. Bir şey rotasını temizlemiş — bir sonraki sevkiyatta yeni emirler alacak.
