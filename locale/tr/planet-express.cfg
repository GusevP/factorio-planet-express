[mod-setting-description]
planet-express-debug-log=Her sevkiyat kararını (neden bu kaynak, bu gemi, bu miktar) günlüğe kaydeder. Ticaret davranışını teşhis etmek için kullanın.
planet-express-dispatch-interval=Sevkiyatçının ne sıklıkta takas aradığı, tik cinsinden (60 = 1 saniye). Daha düşük daha duyarlıdır ama daha çok UPS harcar.
planet-express-min-trip=Bu öğe sayısının altındaki fazlalık yok sayılır, böylece sevkiyatçı asla anlamsız bir damla planlamaz.
planet-express-default-reserve=Her yeni gezegenin bir öğeyi ihraç etmeden önce stokta tuttuğu miktar. Öğe başına istisnalar platformun Ticaret sekmesinde ayarlanır.
planet-express-max-ships-global=Tüm filonun aynı anda uçuşta tutabileceği en fazla gemi sayısı. 0 = sınırsız.
planet-express-max-ships-route=Tek bir kaynak/hedef çifti arasında aynı anda uçuşta olan en fazla gemi sayısı. 0 = sınırsız.
planet-express-two-way-return=Açıkken, eve dönen bir gemi hedefin fazladan sahip olduğu ve kaynağın hâlâ ihtiyaç duyduğu malları da taşır (aynı iki gezegen).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

