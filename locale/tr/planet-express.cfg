[tips-and-tricks-item-description]
planet-express=Planet Express uzay platformlarınızı otomatik bir gezegenler arası nakliye filosuna dönüştürür. Her gezegenin kargo iniş platformunun ne istediğini izler, fazlalığı olan başka bir gezegen bulur ve malları taşımak için kayıtlı platformlarınızdan birini planlar — dönüş yolculuğunda fazla kargoyu geri getirir.\n\nAsla bir şey inşa etmez, yok etmez, ışınlamaz veya elle yerleştirmez: yalnızca bir platformun çizelgesini ve göbeğinin lojistik isteklerini ayarlar. Bir geminin çizelgesini kendiniz düzenleyin, mod geri çekilir ve onu size bırakır.
planet-express-research=Modun tamamı tek bir teknolojinin ardında kilitlidir: [technology=interplanetary-trade-logistics]. Onu araştırana dek Ticaret ve Filo sekmeleri gizli kalır ve hiçbir platforma asla dokunulmaz.\n\nTarifi uzay bilimi gerektirir, bu yüzden onu açabildiğinizde yörüngede kaydedecek bir platformunuz zaten olacaktır.
planet-express-enroll=Bir [entity=space-platform-hub] açın ve Filo sekmesine geçin.\n\nPlatformu Planet Express'e devretmek için "Bu platformu ticaret filosuna kaydet" kutusunu işaretleyin — yalnızca kayıtlı, boştaki gemiler gönderilir. Bir gemiyi kendinize ayırmak için "Elle kullanım için ayır" kutusunu işaretleyin veya bir geminin nereye uçacağını sınırlamak için listedeki gezegenlerin işaretini kaldırın.
planet-express-trade=Bir gezegenin [entity=cargo-landing-pad] öğesini açın ve Ticaret sekmesine geçin. Platformun istediği her şey o gezegenin ithalat talebi olur.\n\nBir gezegenin bir öğeyi ihraç edebilmeden önce bir miktar stok tutması için bir Rezerv ayarlayın, önce gönderilmesi için bir öğenin Önceliğini yükseltin veya bir rotaya Tercih edilen gemi sabitleyin. "Bu gezegen şimdi" göstergesi canlı talebi, ihraç edilebilir fazlalığı ve halihazırda yolda olan kargoyu gösterir.
planet-express-monitor=Sol üst köşede filonuzu bir bakışta gösteren küçük bir durum paneli bulunur — kaç geminin çalıştığını, boşta olduğunu veya takıldığını. Tam Filo İzleyici'yi açmak için ona ya da üst çubuktaki kısayola tıklayın.\n\nİzleyici her gemiyi (adını, rotasını ve mevcut gezegenini) ve gezegene göre gruplanmış bir Talep bölümünü listeler; her biri için neyin teslim edildiğini, yüklendiğini veya hâlâ beklendiğini — ve nedenini gösterir.
planet-express-stuck=Bir gemi, hiç ilerleme kaydetmeden süresi dolduğunda «takıldı» sayılır — genellikle yakıtı ya da roketleri bitmiştir veya yolu kapalıdır. Filo izleyicisinde «takıldı» etiketinin üzerine gelin, nedenini söyler. Yakıt ya da mühimmat ikmali yapın; durum bir sonraki başarılı teslimatta kendiliğinden düzelir.\n\nİtkisini duraklattığınız bir gemi bunun yerine «itki duraklatıldı» gösterir. Duraklatılmış bir platform çizelgesinde asla ilerlemez, bu yüzden filo onun yükünü başka bir gemiye devreder ve bu gemiye dokunmaz — duraklatmayı kaldırın, kendiliğinden filoya döner.\n\nSadece kaynağı olmayan bir gezegen takılmış bir gemi değildir: bu, Gezegenler bölümünde nedeniyle birlikte «bekliyor» olarak görünür (kaynak yok, gemi yok vb.). Bir gemi yalnızca fiziksel olarak hareket edemediğinde takılmıştır.\n\nBir gemi takıldıysa ve bunların hiçbiri açıklamıyorsa, gemi hâlâ takılıyken konsolda [font=default-semibold]/pe-status[/font] komutunu çalıştırın. Teslimattaki her gemi için filonun gördüklerini bildirir ve bunu factorio-current.log dosyasına yazar; böylece hata bildirimine kopyalayabilirsiniz. Yalnızca okur — hiçbir şeyi değiştirmez ve başarımları devre dışı bırakmaz.
planet-express-ready-signal=Bazen bir gemi boştadır ama henüz göndermek istemezsiniz — gidiş dönüş için yeterli yakıt yoktur, cephane azdır veya bir asteroit tamponu hâlâ dolmaktadır.\n\nFilo sekmesinde "Hazır sinyaline kadar beklet" kutusunu işaretleyin. Açıkken Planet Express o platformu yalnızca göbeği [virtual-signal=planet-express-ready] sinyalini sıfırın üzerinde okuduğunda gönderir. Hazırlık mantığını kendi devre öğelerinizde dilediğiniz gibi kurun ve o tek sinyali göbeğe gönderin.\n\nKilit yalnızca sevkiyat içindir: zaten uçuşta olan bir gemiyi asla geri çağırmaz. Bekletilen bir gemi, İzleyici satırında "bekletiliyor" olarak görünür.
