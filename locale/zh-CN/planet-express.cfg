[mod-setting-description]
planet-express-debug-log=将每次调度决策（为何选此来源、此飞船、此数量）记录到日志。用于诊断贸易行为。
planet-express-dispatch-interval=调度器扫描贸易的频率，以刻计（60 = 1 秒）。越低响应越快，但消耗更多 UPS。
planet-express-min-trip=低于此物品数量的盈余将被忽略，使调度器绝不会安排无意义的零星运输。
planet-express-default-reserve=每颗新行星在出口某物品前保留的库存量。逐物品的例外可在着陆场的“贸易”标签页中设置。
planet-express-max-ships-global=整支船队同时可在途的飞船最大数量。0 = 无限制。
planet-express-max-ships-route=单一来源/目的地之间同时在途的飞船最大数量。0 = 无限制。
planet-express-two-way-return=开启后，返航的飞船也会捎带目的地有余、而来源仍需要的货物（同样的两颗行星）。
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

