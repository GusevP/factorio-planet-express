[tips-and-tricks-item-name]
planet-express=Planet Express
planet-express-research=解锁行星际贸易
planet-express-enroll=编入一艘飞船
planet-express-trade=进口、保留与优先级
planet-express-monitor=船队监视器
planet-express-stuck=当飞船“卡住”时
planet-express-ready-signal=保持飞船直到就绪

[tips-and-tricks-item-description]
planet-express=Planet Express 将你的太空平台变成一支自动的行星际运输船队。它关注每颗行星的货物着陆场在请求什么，找到另一颗有盈余的行星，并安排你已编入的某个平台把货物运过去 — 并在回程时捎回多余的货物。\n\n它从不建造、摧毁、传送或手动放入任何东西：它只设定平台的运行时刻表及其中枢的物流请求。你若亲自编辑某艘飞船的时刻表，模组便会退让，把它交给你。
planet-express-research=整个模组都锁在唯一一项科技之后：[technology=interplanetary-trade-logistics]。在你研究它之前，“贸易”和“船队”标签页始终隐藏，任何平台都不会被触碰。\n\n它的配方需要太空科学，因此当你能够解锁它时，你早已有一座在轨平台可供编入。
planet-express-enroll=打开 [entity=space-platform-hub] 并切换到“船队”标签页。\n\n勾选“将此平台编入商船队”，将其交给 Planet Express — 只有已编入且空闲的飞船才会被调度。勾选“保留供手动使用”可把某艘飞船留给自己，或在列表中取消勾选行星，以限制飞船可前往的范围。
planet-express-trade=打开某颗行星的 [entity=cargo-landing-pad] 并切换到“贸易”标签页。着陆场请求的一切都会成为该行星的进口需求。\n\n设定“保留”量，让行星在被允许出口某物品前保留一些库存；提高某物品的“优先级”使其优先发运；或为某条航线指定“首选飞船”。“此行星当前”读数显示实时需求、可出口盈余以及已在途的货物。
planet-express-monitor=屏幕左上角有一个小型状态面板，让你一眼掌握船队 — 有多少飞船在工作、空闲或卡住。点击它，或点击顶栏的快捷方式，即可打开完整的船队监视器。\n\n监视器列出每艘飞船（其名称、航线与当前所在行星），以及按行星分组的“需求”区段，为每颗行星显示哪些正在运送、装载或仍在等待 — 以及原因。
planet-express-stuck=当一艘飞船因毫无进展而超时，它便算作“卡住” — 通常是燃料耗尽、火箭耗尽或路径受阻。为它补充燃料或重新装备，它会在下一次成功送达时自行解除。\n\n仅仅缺乏资源的行星并不是卡住的飞船：那会在“需求”区段中显示为“等待中”，并附上原因（无来源、无飞船等等）。只有当飞船在物理上无法移动时，它才算卡住。
planet-express-ready-signal=有时飞船虽空闲，你却还不想派出它 — 往返燃料不足、弹药偏低，或小行星缓冲仍在填充。\n\n在“船队”标签页中勾选“保持至就绪信号”。开启期间，只有当其中枢读到 [virtual-signal=planet-express-ready] 大于零时，Planet Express 才会派出该平台。请在你自己的逻辑电路中随意构建就绪逻辑，并向中枢发出这一个信号。\n\n此门闸仅作用于派出：它绝不会召回已在途中的飞船。被保持的飞船会在其监视器行中显示为“保持中”。
