[tips-and-tricks-item-description]
planet-express=Planet Express перетворює ваші космічні платформи на автоматичний міжпланетний вантажний флот. Він стежить за тим, що запитує вантажний посадковий майданчик кожної планети, знаходить іншу планету з надлишком і планує одну з ваших зарахованих платформ, щоб перевезти товари — а на зворотному шляху привозить зайвий вантаж.\n\nВін ніколи нічого не будує, не знищує, не телепортує і не вставляє вручну: він лише задає розклад платформи та логістичні запити її хаба. Відредагуйте розклад корабля самі — і мод відступає, залишаючи його вам.
planet-express-research=Увесь мод замкнено за однією технологією: [technology=interplanetary-trade-logistics]. Доки ви її не дослідите, вкладки «Торгівля» та «Флот» залишаються прихованими, і жодна платформа не зачіпається.\n\nЇї рецепт потребує космічної науки, тож на момент, коли ви зможете її відкрити, у вас уже буде платформа на орбіті для зарахування.
planet-express-enroll=Відкрийте [entity=space-platform-hub] і перейдіть на вкладку «Флот».\n\nПозначте «Зарахувати цю платформу до торгового флоту», щоб передати її Planet Express — відправляються лише зараховані кораблі, що простоюють. Позначте «Зарезервувати для ручного використання», щоб лишити корабель собі, або зніміть позначки з планет у списку, щоб обмежити, куди полетить корабель.
planet-express-trade=Відкрийте [entity=cargo-landing-pad] планети і перейдіть на вкладку «Торгівля». Усе, що запитує майданчик, стає імпортним попитом цієї планети.\n\nЗадайте Резерв, щоб планета тримала частину запасу, перш ніж їй дозволять експортувати предмет, підвищте Пріоритет предмета, щоб він відправлявся першим, або закріпіть Бажаний корабель за маршрутом. Зведення «Ця планета зараз» показує поточний попит, експортований надлишок і вантаж, що вже в дорозі.
planet-express-monitor=Невелика панель стану розташована у верхньому лівому куті й показує ваш флот з одного погляду — скільки кораблів працюють, простоюють або застрягли. Натисніть на неї або на ярлик на верхній панелі, щоб відкрити повний Монітор флоту.\n\nМонітор перелічує кожен корабель (його ім'я, маршрут і поточну планету) та розділ «Попит», згрупований за планетами, показуючи для кожної, що доставляється, завантажується або ще очікується — і чому.
planet-express-stuck=Корабель вважається «застряглим», коли він перевищує тайм-аут без поступу — зазвичай без палива, без ракет або із заблокованим шляхом. Заправте або переозбройте його, і він звільниться сам під час наступної успішної доставки.\n\nПланета, якій просто бракує ресурсів, — це не застряглий корабель: це показано в розділі «Попит» як «очікування», із причиною (немає джерела, немає корабля тощо). Корабель застряг лише тоді, коли фізично не може рухатися.
planet-express-ready-signal=Іноді корабель простоює, але ви поки не хочете його відправляти — недостатньо палива для рейсу туди й назад, мало боєприпасів або буфер астероїдів ще наповнюється.\n\nНа вкладці «Флот» позначте «Утримувати до сигналу готовності». Доки вона увімкнена, Planet Express відправляє цю платформу, лише коли її хаб читає [virtual-signal=planet-express-ready] вище нуля. Побудуйте логіку готовності як завгодно у власних комбінаторах і подайте цей єдиний сигнал на хаб.\n\nЗатвор стосується лише відправлення: він ніколи не відкликає корабель, що вже в польоті. Утриманий корабель відображається як «утриманий» у своєму рядку Монітора.
