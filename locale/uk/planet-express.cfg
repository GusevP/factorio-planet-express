interplanetary-trade-logistics=Логістика міжпланетної торгівлі

[technology-description]
interplanetary-trade-logistics=Відкриває торгову панель Planet Express на вантажних посадкових майданчиках і можливість зараховувати космічні платформи до вашого торгового флоту.

[mod-setting-name]
planet-express-debug-log=Planet Express: журнал налагодження
planet-express-dispatch-interval=Planet Express: інтервал диспетчера (тики)
planet-express-min-trip=Planet Express: мінімальний розмір рейсу
planet-express-default-reserve=Planet Express: резерв за замовчуванням
planet-express-max-ships-global=Planet Express: макс. кораблів одночасно (загалом)
planet-express-max-ships-route=Planet Express: макс. кораблів одночасно (на маршрут)
planet-express-two-way-return=Planet Express: двостороння зворотна торгівля
planet-express-min-load=Planet Express: minimum cargo load (%)

[mod-setting-description]
planet-express-debug-log=Записує кожне рішення диспетчера (чому це джерело, цей корабель, ця кількість) до журналу. Використовуйте для діагностики поведінки торгівлі.
planet-express-dispatch-interval=Як часто диспетчер шукає угоди, у тиках (60 = 1 секунда). Менше — чутливіше, але дорожче за UPS.
planet-express-min-trip=Надлишок нижче цієї кількості предметів ігнорується, щоб диспетчер ніколи не планував безглузду цівку.
planet-express-default-reserve=Кількість, яку кожна нова планета тримає в запасі, перш ніж експортувати предмет. Винятки за предметами задаються на вкладці «Торгівля» майданчика.
planet-express-max-ships-global=Максимальна кількість кораблів, яку весь флот може тримати в польоті одночасно. 0 = без обмежень.
planet-express-max-ships-route=Максимальна кількість кораблів у польоті між однією парою джерело/призначення одночасно. 0 = без обмежень.
planet-express-two-way-return=Коли увімкнено, корабель, що повертається, також везе товари, яких призначення має вдосталь, а джерелу ще потрібні (ті самі дві планети).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

