[virtual-signal-description]
planet-express-ready=Подайте цей сигнал (значення > 0) на хаб платформи, щоб позначити її корабель готовим до відправлення, коли увімкнено перемикач «Утримувати до сигналу готовності». Побудуйте логіку готовності у власних комбінаторах.

