[tips-and-tricks-item-description]
planet-express=Planet Express zamienia twoje platformy kosmiczne w automatyczną międzyplanetarną flotę transportową. Obserwuje, czego żąda lądowisko towarowe każdej planety, znajduje inną planetę z nadwyżką i planuje jedną z twoich zapisanych platform, by przewieźć towary — przywożąc nadmiarowy ładunek w drodze powrotnej.\n\nNigdy niczego nie buduje, nie niszczy, nie teleportuje ani nie wkłada ręcznie: ustawia jedynie harmonogram platformy i żądania logistyczne jej koncentratora. Edytuj harmonogram statku samodzielnie, a mod się wycofuje i zostawia go tobie.
planet-express-research=Cały mod jest zablokowany za jedną technologią: [technology=interplanetary-trade-logistics]. Dopóki jej nie zbadasz, karty Handel i Flota pozostają ukryte, a żadna platforma nie jest dotykana.\n\nJej receptura wymaga nauki kosmicznej, więc zanim zdołasz ją odblokować, będziesz już mieć platformę na orbicie do zapisania.
planet-express-enroll=Otwórz [entity=space-platform-hub] i przejdź do karty Flota.\n\nZaznacz „Zapisz tę platformę do floty handlowej”, aby przekazać ją Planet Express — wysyłane są tylko zapisane, bezczynne statki. Zaznacz „Zarezerwuj do użytku ręcznego”, aby zachować statek dla siebie, lub odznacz planety na liście, aby ograniczyć, dokąd statek poleci.
planet-express-trade=Otwórz [entity=cargo-landing-pad] planety i przejdź do karty Handel. Wszystko, czego żąda lądowisko, staje się popytem importowym tej planety.\n\nUstaw Rezerwę, aby planeta zachowała trochę zapasu, zanim będzie mogła wyeksportować przedmiot, podnieś Priorytet przedmiotu, aby był wysyłany jako pierwszy, lub przypnij Preferowany statek do trasy. Odczyt „Ta planeta teraz” pokazuje bieżący popyt, eksportowalną nadwyżkę i ładunek już w drodze.
planet-express-monitor=Mały panel stanu znajduje się w lewym górnym rogu i pokazuje twoją flotę w skrócie — ile statków pracuje, jest bezczynnych lub utknęło. Kliknij go lub skrót na górnym pasku, aby otworzyć pełny Monitor floty.\n\nMonitor wymienia każdy statek (jego nazwę, trasę i bieżącą planetę) oraz sekcję Popyt pogrupowaną według planet, pokazując dla każdej, co jest dostarczane, ładowane lub wciąż oczekiwane — i dlaczego.
planet-express-stuck=Statek liczy się jako „utknięty”, gdy przekroczy limit czasu bez postępu — zwykle bez paliwa, bez rakiet lub z zablokowaną drogą. Zatankuj go lub przezbrój, a sam się uwolni przy następnej udanej dostawie.\n\nPlaneta, której po prostu brakuje zasobów, to nie utknięty statek: to widać w sekcji Popyt jako „oczekiwanie”, z powodem (brak źródła, brak statku itd.). Statek jest utknięty tylko wtedy, gdy fizycznie nie może się ruszyć.
planet-express-ready-signal=Czasem statek jest bezczynny, ale nie chcesz go jeszcze wysyłać — za mało paliwa na podróż w obie strony, mało amunicji lub bufor asteroid wciąż się napełnia.\n\nNa karcie Flota zaznacz „Wstrzymaj do sygnału gotowości”. Gdy jest włączone, Planet Express wysyła tę platformę tylko wtedy, gdy jej koncentrator odczytuje [virtual-signal=planet-express-ready] powyżej zera. Zbuduj logikę gotowości dowolnie we własnych przekaźnikach i wyślij ten jeden sygnał do koncentratora.\n\nBlokada dotyczy tylko wysyłki: nigdy nie odwołuje statku już w locie. Wstrzymany statek pokazuje się jako „wstrzymany” w swoim wierszu Monitora.
