[mod-setting-description]
planet-express-debug-log=Zapisuje każdą decyzję dyspozytora (dlaczego to źródło, ten statek, ta ilość) w dzienniku. Używaj do diagnozowania zachowania handlu.
planet-express-dispatch-interval=Jak często dyspozytor szuka wymian, w taktach (60 = 1 sekunda). Niżej znaczy bardziej responsywnie, ale kosztuje więcej UPS.
planet-express-min-trip=Nadwyżka poniżej tej liczby przedmiotów jest ignorowana, aby dyspozytor nigdy nie planował bezsensownej strużki.
planet-express-default-reserve=Ilość, którą każda nowa planeta trzyma w zapasie, zanim wyeksportuje przedmiot. Wyjątki dla poszczególnych przedmiotów ustawia się na karcie Handel lądowiska.
planet-express-max-ships-global=Maksymalna liczba statków, które cała flota może mieć w locie naraz. 0 = bez limitu.
planet-express-max-ships-route=Maksymalna liczba statków w locie między jedną parą źródło/cel naraz. 0 = bez limitu.
planet-express-two-way-return=Gdy włączone, wracający statek wiezie też towary, których cel ma w nadmiarze, a źródło wciąż potrzebuje (te same dwie planety).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

