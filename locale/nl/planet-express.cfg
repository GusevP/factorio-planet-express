[mod-setting-description]
planet-express-debug-log=Registreert elke verzendbeslissing (waarom deze bron, dit schip, deze hoeveelheid) in het logboek. Gebruik dit om handelsgedrag te diagnosticeren.
planet-express-dispatch-interval=Hoe vaak de verzender naar handelsmogelijkheden zoekt, in ticks (60 = 1 seconde). Lager is responsiever maar kost meer UPS.
planet-express-min-trip=Overschot onder dit aantal items wordt genegeerd, zodat de verzender nooit een zinloos straaltje inplant.
planet-express-default-reserve=De hoeveelheid die elke nieuwe planeet op voorraad houdt voordat ze een item exporteert. Uitzonderingen per item stel je in op het tabblad Handel van het platform.
planet-express-max-ships-global=Maximaal aantal schepen dat de hele vloot tegelijk in de vlucht mag hebben. 0 = onbeperkt.
planet-express-max-ships-route=Maximaal aantal schepen in de vlucht tussen één bron/bestemming-paar tegelijk. 0 = onbeperkt.
planet-express-two-way-return=Indien ingeschakeld vervoert een terugkerend schip ook goederen die de bestemming over heeft en die de bron nog nodig heeft (dezelfde twee planeten).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

