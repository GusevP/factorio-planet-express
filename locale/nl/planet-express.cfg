[tips-and-tricks-item-description]
planet-express=Planet Express verandert je ruimteplatforms in een automatische interplanetaire vrachtvloot. Het houdt in de gaten wat het vrachtlandingsplatform van elke planeet aanvraagt, vindt een andere planeet met een overschot en plant een van je ingeschreven platforms in om de goederen over te brengen — en brengt overtollige vracht mee op de terugreis.\n\nHet bouwt, vernietigt, teleporteert of plaatst nooit iets met de hand: het stelt alleen het schema van een platform en de logistieke aanvragen van zijn hub in. Bewerk het schema van een schip zelf en de mod trekt zich terug en laat het aan jou over.
planet-express-research=De hele mod zit achter één technologie: [technology=interplanetary-trade-logistics]. Tot je die hebt onderzocht, blijven de tabbladen Handel en Vloot verborgen en wordt geen enkel platform ooit aangeraakt.\n\nHet recept ervan vereist ruimtewetenschap, dus tegen de tijd dat je het kunt ontgrendelen heb je al een platform in een baan om in te schrijven.
planet-express-enroll=Open een [entity=space-platform-hub] en schakel over naar het tabblad Vloot.\n\nVink "Dit platform inschrijven in de handelsvloot" aan om het aan Planet Express over te dragen — alleen ingeschreven, inactieve schepen worden ooit verzonden. Vink "Reserveren voor handmatig gebruik" aan om een schip voor jezelf te houden, of vink planeten in de lijst uit om te beperken waar een schip naartoe vliegt.
planet-express-trade=Open de [entity=cargo-landing-pad] van een planeet en schakel over naar het tabblad Handel. Alles wat het platform aanvraagt wordt de invoervraag van die planeet.\n\nStel een Reserve in zodat een planeet wat voorraad behoudt voordat ze een item mag exporteren, verhoog de Prioriteit van een item zodat het als eerste wordt verzonden, of zet een Voorkeursschip vast op een route. De uitlezing "Deze planeet nu" toont de live vraag, het exporteerbare overschot en vracht die al onderweg is.
planet-express-monitor=Een klein statuspaneel zit in de linkerbovenhoek met je vloot in één oogopslag — hoeveel schepen werken, inactief zijn of vastzitten. Klik erop, of op de snelkoppeling in de bovenbalk, om de volledige Vlootmonitor te openen.\n\nDe Monitor toont elk schip (zijn naam, route en huidige planeet) en een sectie Vraag gegroepeerd per planeet, die voor elk laat zien wat er wordt bezorgd, geladen of nog wordt verwacht — en waarom.
planet-express-stuck=Een schip telt als "vastgelopen" wanneer het zonder vooruitgang een time-out krijgt — meestal zonder brandstof, zonder raketten, of met een geblokkeerd pad. Tank het bij of bewapen het opnieuw en het maakt zichzelf los bij zijn volgende geslaagde levering.\n\nEen planeet die simpelweg grondstoffen tekortkomt is geen vastgelopen schip: dat verschijnt in de sectie Vraag als "wacht", met de reden (geen bron, geen schip, enzovoort). Een schip zit alleen vast wanneer het zich fysiek niet kan verplaatsen.
planet-express-ready-signal=Soms is een schip inactief maar wil je het nog niet verzenden — niet genoeg brandstof voor de heen-en-terugreis, weinig munitie, of een asteroïdebuffer die nog vol loopt.\n\nVink op het tabblad Vloot "Vasthouden tot gereed-signaal" aan. Zolang dit aan staat, verzendt Planet Express dat platform alleen wanneer zijn hub [virtual-signal=planet-express-ready] boven nul leest. Bouw de gereedheidslogica zoals je wilt in je eigen combinators en stuur dat ene signaal naar de hub.\n\nDe vergrendeling geldt alleen voor verzending: ze roept nooit een schip terug dat al in de vlucht is. Een vastgehouden schip verschijnt als "vastgehouden" op zijn Monitor-regel.
