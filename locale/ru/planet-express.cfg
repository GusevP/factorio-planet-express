[tips-and-tricks-item-description]
planet-express=Planet Express превращает ваши космические платформы в автоматический межпланетный грузовой флот. Он следит за тем, что запрашивает грузовая посадочная площадка каждой планеты, находит другую планету с излишком и планирует одну из ваших зачисленных платформ, чтобы перевезти товары — а на обратном пути привозит лишний груз.\n\nОн никогда ничего не строит, не уничтожает, не телепортирует и не вставляет вручную: он лишь задаёт расписание платформы и логистические запросы её хаба. Отредактируйте расписание корабля сами — и мод отступает, оставляя его вам.
planet-express-research=Весь мод заперт за одной технологией: [technology=interplanetary-trade-logistics]. Пока вы её не исследуете, вкладки «Торговля» и «Флот» остаются скрытыми, и ни одна платформа не затрагивается.\n\nЕё рецепт требует космической науки, поэтому к моменту, когда вы сможете её открыть, у вас уже будет платформа на орбите для зачисления.
planet-express-enroll=Откройте [entity=space-platform-hub] и перейдите на вкладку «Флот».\n\nОтметьте «Зачислить эту платформу в торговый флот», чтобы передать её Planet Express — отправляются только зачисленные простаивающие корабли. Отметьте «Зарезервировать для ручного использования», чтобы оставить корабль себе, или снимите отметки с планет в списке, чтобы ограничить, куда полетит корабль.
planet-express-trade=Откройте [entity=cargo-landing-pad] планеты и перейдите на вкладку «Торговля». Всё, что запрашивает площадка, становится импортным спросом этой планеты.\n\nЗадайте Резерв, чтобы планета держала часть запаса, прежде чем ей разрешат экспортировать предмет, повысьте Приоритет предмета, чтобы он отправлялся первым, или закрепите Предпочтительный корабль за маршрутом. Сводка «Эта планета сейчас» показывает текущий спрос, экспортируемый излишек и груз, уже находящийся в пути.
planet-express-monitor=Небольшая панель состояния находится в левом верхнем углу и показывает ваш флот с одного взгляда — сколько кораблей в работе, простаивают или застряли. Нажмите на неё или на ярлык на верхней панели, чтобы открыть полный Монитор флота.\n\nМонитор перечисляет каждый корабль (его имя, маршрут и текущую планету) и раздел «Спрос», сгруппированный по планетам, показывая для каждой, что доставляется, грузится или ещё ожидается — и почему.
planet-express-stuck=Корабль считается «застрявшим», когда он превышает таймаут без прогресса — обычно без топлива, без ракет или с заблокированным путём. Заправьте или перевооружите его, и он освободится сам при следующей успешной доставке.\n\nПланета, которой просто не хватает ресурсов, — это не застрявший корабль: это показано в разделе «Спрос» как «ожидание», с причиной (нет источника, нет корабля и так далее). Корабль застрял только тогда, когда физически не может двигаться.
planet-express-ready-signal=Иногда корабль простаивает, но вы пока не хотите его отправлять — недостаточно топлива для рейса туда-обратно, мало боеприпасов или буфер астероидов ещё наполняется.\n\nНа вкладке «Флот» отметьте «Удерживать до сигнала готовности». Пока она включена, Planet Express отправляет эту платформу, только когда её хаб читает [virtual-signal=planet-express-ready] выше нуля. Постройте логику готовности как угодно в своих комбинаторах и подайте этот единственный сигнал на хаб.\n\nЗатвор касается только отправки: он никогда не отзывает корабль, уже находящийся в полёте. Удержанный корабль отображается как «удержан» в своей строке Монитора.
