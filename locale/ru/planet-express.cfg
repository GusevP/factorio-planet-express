[technology-name]
interplanetary-trade-logistics=Логистика межпланетной торговли

[technology-description]
interplanetary-trade-logistics=Открывает торговую панель Planet Express на грузовых посадочных площадках и возможность зачислять космические платформы в ваш торговый флот.

[mod-setting-name]
planet-express-debug-log=Planet Express: журнал отладки
planet-express-dispatch-interval=Planet Express: интервал диспетчера (тики)
planet-express-min-trip=Planet Express: минимальный размер рейса
planet-express-default-reserve=Planet Express: резерв по умолчанию
planet-express-max-ships-global=Planet Express: макс. кораблей одновременно (всего)
planet-express-max-ships-route=Planet Express: макс. кораблей одновременно (на маршрут)
planet-express-two-way-return=Planet Express: двусторонняя обратная торговля
planet-express-min-load=Planet Express: minimum cargo load (%)

[mod-setting-description]
planet-express-debug-log=Записывает каждое решение диспетчера (почему этот источник, этот корабль, это количество) в журнал. Используйте для диагностики поведения торговли.
planet-express-dispatch-interval=Как часто диспетчер ищет сделки, в тиках (60 = 1 секунда). Меньше — отзывчивее, но дороже по UPS.
planet-express-min-trip=Излишек ниже этого количества предметов игнорируется, чтобы диспетчер никогда не планировал бессмысленную струйку.
planet-express-default-reserve=Количество, которое каждая новая планета держит в запасе, прежде чем экспортировать предмет. Исключения по предметам задаются на вкладке «Торговля» площадки.
planet-express-max-ships-global=Максимальное число кораблей, которые весь флот может держать в полёте одновременно. 0 = без ограничений.
planet-express-max-ships-route=Максимальное число кораблей в полёте между одной парой источник/назначение одновременно. 0 = без ограничений.
planet-express-two-way-return=Когда включено, возвращающийся корабль также везёт товары, которых у назначения в избытке, а источнику ещё нужны (те же две планеты).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

[shortcut-name]
planet-express-monitor=Planet Express: монитор флота

[virtual-signal-name]
planet-express-ready=Planet Express: готов

[virtual-signal-description]
planet-express-ready=Подайте этот сигнал (значение > 0) на хаб платформы, чтобы пометить её корабль готовым к отправке, когда включён переключатель «Удерживать до сигнала готовности». Постройте логику готовности в своих комбинаторах.

