planet-express-debug-log=Planet Express: ladicí protokol
planet-express-dispatch-interval=Planet Express: interval dispečera (tiky)
planet-express-min-trip=Planet Express: minimální velikost zásilky
planet-express-default-reserve=Planet Express: výchozí rezerva
planet-express-max-ships-global=Planet Express: max. lodí najednou (globálně)
planet-express-max-ships-route=Planet Express: max. lodí najednou (na trasu)
