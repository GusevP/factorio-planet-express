[mod-setting-description]
planet-express-debug-log=Zaznamenává každé rozhodnutí dispečera (proč tento zdroj, tato loď, toto množství) do protokolu. Použij pro diagnostiku chování obchodu.
planet-express-dispatch-interval=Jak často dispečer hledá výměny, v ticích (60 = 1 sekunda). Nižší je pohotovější, ale stojí více UPS.
planet-express-min-trip=Přebytek pod tímto počtem předmětů je ignorován, aby dispečer nikdy nenaplánoval zbytečný pramínek.
planet-express-default-reserve=Množství, které si každá nová planeta drží na skladě, než vyveze předmět. Výjimky pro jednotlivé předměty se nastavují na kartě Obchod přistávací plochy.
planet-express-max-ships-global=Maximální počet lodí, které může mít celá flotila najednou v letu. 0 = bez omezení.
planet-express-max-ships-route=Maximální počet lodí v letu mezi jednou dvojicí zdroj/cíl najednou. 0 = bez omezení.
planet-express-two-way-return=Když je zapnuto, vracející se loď veze i zboží, kterého má cíl nazbyt a zdroj ho stále potřebuje (tytéž dvě planety).
planet-express-min-load=Minimum % of cargo a ship must fill before dispatch (0 = ship any load). Perishables and idle-fleet trips are exempt, so a small but waiting load still ships when no fuller trip is contending for the ship.

