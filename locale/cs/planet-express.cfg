[tips-and-tricks-item-description]
planet-express=Planet Express promění tvé vesmírné platformy v automatickou meziplanetární přepravní flotilu. Sleduje, co nákladní přistávací plocha každé planety požaduje, najde jinou planetu s přebytkem a naplánuje jednu z tvých zařazených platforem, aby zboží převezla — a na zpáteční cestě přiveze přebytečný náklad.\n\nNikdy nic nestaví, neničí, neteleportuje ani ručně nevkládá: pouze nastaví jízdní řád platformy a logistické požadavky jejího uzlu. Uprav jízdní řád lodi sám a mod ustoupí a nechá ho na tobě.
planet-express-research=Celý mod je uzamčen za jedinou technologií: [technology=interplanetary-trade-logistics]. Dokud ji nevyzkoumáš, karty Obchod a Flotila zůstávají skryté a žádné platformy se nikdy nedotkne.\n\nJejí recept vyžaduje vesmírnou vědu, takže než ji budeš moci odemknout, budeš už mít na oběžné dráze platformu k zařazení.
planet-express-enroll=Otevři [entity=space-platform-hub] a přepni na kartu Flotila.\n\nZaškrtni „Zařadit tuto platformu do obchodní flotily“, abys ji předal Planet Express — odesílají se pouze zařazené, nečinné lodě. Zaškrtni „Rezervovat pro ruční použití“, abys si loď nechal pro sebe, nebo odškrtni planety v seznamu, abys omezil, kam loď poletí.
planet-express-trade=Otevři [entity=cargo-landing-pad] planety a přepni na kartu Obchod. Vše, co přistávací plocha požaduje, se stane dovozní poptávkou té planety.\n\nNastav Rezervu, aby si planeta nechala nějakou zásobu, než smí předmět vyvézt, zvyš Prioritu předmětu, aby se odeslal jako první, nebo připni Preferovanou loď k trase. Odečet „Tato planeta nyní“ ukazuje aktuální poptávku, vyvezitelný přebytek a náklad, který už je na cestě.
planet-express-monitor=Malý panel stavu sedí v levém horním rohu a ukazuje tvou flotilu na první pohled — kolik lodí pracuje, je nečinných nebo uvázlých. Klikni na něj nebo na zkratku v horní liště, abys otevřel celý Monitor flotily.\n\nMonitor vypisuje každou loď (její jméno, trasu a aktuální planetu) a sekci Poptávka seskupenou podle planet, ukazující pro každou, co se doručuje, nakládá nebo stále čeká — a proč.
planet-express-stuck=Loď se počítá jako „uvázlá“, když vyprší časový limit bez postupu — obvykle bez paliva, bez raket nebo se zablokovanou cestou. Doplň jí palivo nebo ji přezbroj a sama se uvolní při své příští úspěšné dodávce.\n\nPlaneta, které prostě chybí zdroje, není uvázlá loď: to se zobrazí v sekci Poptávka jako „čeká“, s důvodem (žádný zdroj, žádná loď a tak dále). Loď je uvázlá pouze tehdy, když se fyzicky nemůže pohnout.
planet-express-ready-signal=Někdy je loď nečinná, ale ještě ji nechceš odeslat — málo paliva na zpáteční cestu, málo munice nebo zásobník asteroidů se ještě plní.\n\nNa kartě Flotila zaškrtni „Zadržet do signálu připravenosti“. Dokud je zapnuto, Planet Express odesílá tuto platformu pouze tehdy, když její uzel čte [virtual-signal=planet-express-ready] nad nulou. Logiku připravenosti si postav jakkoli ve vlastních klopných obvodech a vyšli ten jediný signál do uzlu.\n\nZámek se týká jen odeslání: nikdy neodvolá loď, která už je v letu. Zadržená loď se zobrazí jako „zadrženo“ ve svém řádku Monitoru.
