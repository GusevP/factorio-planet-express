interplanetary-trade-logistics=Logistika meziplanetárního obchodu

[technology-description]
interplanetary-trade-logistics=Odemkne obchodní překryv Planet Express na nákladních přistávacích plochách a možnost zařadit vesmírné platformy do tvé obchodní flotily.

